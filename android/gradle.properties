# The build shares a 16 GB machine with the emulator (it raises itself to 4 GB), the editor and the web stack.
# An 8 GB heap + 4 GB metaspace let one build push the host into paging and the emulator froze or died
# right after it (2026-10-11, twice). A debug build of this app fits in 3 GB.
org.gradle.jvmargs=-Xmx3G -XX:MaxMetaspaceSize=768m -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
# A finished build must not keep its heap for hours: retire the daemon after 5 idle minutes.
org.gradle.daemon.idletimeout=300000
org.gradle.workers.max=2
android.useAndroidX=true

# The Kotlin compile daemon can't be reached on this machine (every build
# logs "Could not connect to Kotlin compile daemon" and silently falls back
# to a slower in-process compile per module anyway) — likely a Windows
# Firewall prompt on the new JDK's java.exe never got answered. Skip the
# daemon attempt outright instead of eating a failed-connection retry (4
# attempts) before every single compile task.
kotlin.compiler.execution.strategy=in-process
