name: bim_app
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+1

environment:
  sdk: ^3.10.4

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^2.6.1

  # Navigation
  go_router: ^14.6.2

  # i18n
  intl: ^0.20.2

  # API client
  dio: ^5.7.0

  # Local storage
  shared_preferences: ^2.3.3
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  flutter_secure_storage: ^9.2.2

  # Images / forms
  cached_network_image: ^3.4.1
  image_picker: ^1.1.2
  flutter_form_builder: ^10.3.0
  form_builder_validators: ^11.0.0

  # Native share sheet
  share_plus: ^11.0.0

  # Tap-to-call / open-in-maps from the business info screen
  url_launcher: ^6.3.1

  # Calendar (booking module)
  table_calendar: ^3.1.3

  # Design
  flutter_svg: ^2.0.16

  # Connectivity
  connectivity_plus: ^6.1.0

  # Responsive breakpoints — replaces the hand-rolled Breakpoints class
  # (lib/core/responsive/breakpoints.dart), which now delegates to this
  # package internally so no call site elsewhere in the app had to change.
  responsive_framework: ^1.5.1

  # Device location — for the customer's own profile location. No API key
  # needed (that's only google_maps_flutter, for rendering a map view, still
  # deferred below); geolocator is just permission + native location
  # services.
  geolocator: ^13.0.2

  # NOTE: google_fonts was removed on purpose. On Flutter Web it never
  # actually fetches the font bytes for the CanvasKit/Skwasm renderer (only a
  # <link> in web/index.html helps, and even that only benefits the HTML
  # renderer) — Arabic text silently rendered as tofu boxes. Cairo is bundled
  # directly instead (see the `fonts:` section below), which is correct on
  # every platform and doesn't depend on network access at first paint.

  # NOTE: deliberately NOT added yet — each needs native project config
  # (API keys / google-services.json / Info.plist entries) we don't have
  # values for, and would break a fresh `flutter run` if added blind:
  #   google_maps_flutter, geocoding  -> add when a screen needs to actually
  #     render a map or reverse-geocode an address (needs a Maps API key)
  #   firebase_messaging              -> add when push notifications are
  #     wired (needs a Firebase project + google-services.json)

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0
  build_runner: ^2.4.13
  hive_generator: ^2.0.1
  flutter_launcher_icons: ^0.14.3

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  generate: true

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # Cairo — a single variable TTF (weight axis) from Google Fonts' own
  # google/fonts GitHub repo, registered once per weight actually used in
  # app_theme.dart. Flutter/Skia resolves the right instance from the same
  # file for each entry (the documented variable-font pattern).
  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-Variable.ttf
          weight: 400
        - asset: assets/fonts/Cairo-Variable.ttf
          weight: 500
        - asset: assets/fonts/Cairo-Variable.ttf
          weight: 600
        - asset: assets/fonts/Cairo-Variable.ttf
          weight: 700

  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package

# Regenerate after changing the source art: dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  # Opaque (navy bg + gold pin) on purpose — iOS forbids alpha in app icons,
  # and Android's legacy (non-adaptive) launcher icon looks wrong with a
  # transparent background too.
  image_path: "assets/branding/bim_mark_icon_1024.png"
  min_sdk_android: 21
  adaptive_icon_background: "#0B1F3A"
  adaptive_icon_foreground: "assets/branding/bim_mark_1024.png"
  web:
    generate: true
    image_path: "assets/branding/bim_mark_icon_1024.png"
    background_color: "#0B1F3A"
    theme_color: "#0B1F3A"
  windows:
    generate: true
    image_path: "assets/branding/bim_mark_icon_1024.png"
  macos:
    generate: true
    image_path: "assets/branding/bim_mark_icon_1024.png"
